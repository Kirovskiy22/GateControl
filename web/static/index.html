<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate Control</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --green: #4ecca3;
      --red: #e94560;
      --text: #eaeaea;
      --muted: #8892b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .stream-card,
    .status-card,
    .log-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .stream-card label.status-label {
      display: block;
      margin-bottom: 8px;
    }

    #rtsp-url {
      width: 100%;
      border: 1px solid #0f3460;
      border-radius: 8px;
      background: #0f3460;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .stream-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .btn-stream {
      flex: 1;
      background: #0f3460;
      color: var(--text);
      font-weight: 600;
      padding: 12px;
      font-size: 1rem;
    }

    .status-card {
      text-align: center;
    }

    .status-label {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .status-value {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .status-value.open { color: var(--green); }
    .status-value.closed { color: var(--red); }
    .status-value.unknown { color: var(--muted); }

    .anpr-meta {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .anpr-meta strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      margin-top: 4px;
    }

    .anpr-meta .ok { color: var(--green); }
    .anpr-meta .bad { color: var(--red); }

    .snapshot-wrap {
      margin-top: 16px;
      border-radius: 10px;
      overflow: hidden;
      background: #0f3460;
      min-height: 120px;
      display: none;
    }

    .snapshot-wrap.visible { display: block; }

    .snapshot-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-open { background: var(--green); color: #111; }
    .btn-close { background: var(--red); color: #fff; }
    .btn-refresh { background: #0f3460; color: var(--text); font-weight: 600; }

    .log-card h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #log {
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
      color: var(--muted);
    }

    #log .entry { margin-bottom: 4px; }
    #log .error { color: var(--red); }
    #log .success { color: var(--green); }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f3460;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="stream-card">
      <label class="status-label" for="rtsp-url">RTSP-поток</label>
      <input id="rtsp-url" type="text" placeholder="rtsp://user:pass@host:554/stream" autocomplete="off" spellcheck="false">
      <div class="stream-row">
        <label class="flip-row">
          <input id="rtsp-flip" type="checkbox">
          зеркально
        </label>
        <button id="btn-stream" class="btn-stream" type="button">Подключить</button>
      </div>
    </div>

    <div class="status-card">
      <div class="status-label">Состояние шлагбаума</div>
      <div id="status" class="status-value unknown">неизвестно</div>
    </div>

    <div class="status-card">
      <div class="status-label">Камера и номер</div>
      <div id="anpr-plate" class="status-value unknown">нет номера</div>
      <div class="anpr-meta">
        <div>
          Камера
          <strong id="anpr-camera" class="bad">выключена</strong>
        </div>
        <div>
          Поток
          <strong id="anpr-stream">—</strong>
        </div>
        <div>
          Решение
          <strong id="anpr-reason">ожидание</strong>
        </div>
      </div>
      <div id="snapshot-wrap" class="snapshot-wrap">
        <img id="anpr-snapshot" alt="Кадр с камеры">
      </div>
    </div>

    <div class="buttons">
      <button id="btn-open" class="btn-open">ПОДНЯТЬ</button>
      <button id="btn-close" class="btn-close">ОПУСТИТЬ</button>
      <button id="btn-refresh" class="btn-refresh">ОБНОВИТЬ</button>
    </div>

    <div class="log-card">
      <h2>Журнал</h2>
      <div id="log"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const toastEl = document.getElementById("toast");
    const anprPlateEl = document.getElementById("anpr-plate");
    const anprCameraEl = document.getElementById("anpr-camera");
    const anprStreamEl = document.getElementById("anpr-stream");
    const anprReasonEl = document.getElementById("anpr-reason");
    const snapshotWrapEl = document.getElementById("snapshot-wrap");
    const snapshotEl = document.getElementById("anpr-snapshot");
    const rtspUrlEl = document.getElementById("rtsp-url");
    const rtspFlipEl = document.getElementById("rtsp-flip");
    const btnStreamEl = document.getElementById("btn-stream");
    const buttons = [
      document.getElementById("btn-open"),
      document.getElementById("btn-close"),
      document.getElementById("btn-refresh"),
    ];
    let lastAnprEventId = 0;
    let snapshotTick = 0;
    let streamPrefill = false;
    let lastCameraState = "";
    let serverOnline = true;

    function setButtonsDisabled(disabled) {
      buttons.forEach((btn) => (btn.disabled = disabled));
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    function appendLog(text, kind = "") {
      const entry = document.createElement("div");
      entry.className = "entry" + (kind ? " " + kind : "");
      const time = new Date().toLocaleTimeString("ru-RU");
      entry.textContent = `[${time}] ${text}`;
      logEl.prepend(entry);
      while (logEl.children.length > 50) {
        logEl.removeChild(logEl.lastChild);
      }
    }

    function cameraLabel(anpr) {
      if (!anpr || !anpr.enabled) return "выключена";
      const map = {
        connected: "подключена",
        connecting: "подключение",
        disconnected: "нет связи",
        disabled: "выключена",
      };
      if (anpr.reader === "loading") return "загрузка модели";
      return map[anpr.camera] || anpr.camera || "неизвестно";
    }

    function renderAnpr(anpr) {
      if (!anpr) return;

      const plate = anpr.last_plate_display || anpr.last_plate;
      anprPlateEl.textContent = plate || "нет номера";
      anprPlateEl.className = "status-value";
      if (anpr.last_decision === "opened") anprPlateEl.classList.add("open");
      else if (plate) anprPlateEl.classList.add("unknown");
      else anprPlateEl.classList.add("unknown");

      anprCameraEl.textContent = cameraLabel(anpr);
      anprCameraEl.className =
        anpr.camera === "connected" || anpr.camera === "connecting" ? "ok" : "bad";
      const stream = anpr.stream;
      if (stream) {
        anprStreamEl.textContent =
          `${stream.width}×${stream.height} · ${stream.fps} fps · анализ ${stream.process_interval_sec} с`;
      } else if (anpr.camera === "connecting") {
        anprStreamEl.textContent = "анализ параметров…";
      } else {
        anprStreamEl.textContent = "—";
      }
      anprReasonEl.textContent = anpr.last_reason || anpr.error || "ожидание";

      if (!streamPrefill) {
        if (anpr.rtsp_url) rtspUrlEl.value = anpr.rtsp_url;
        rtspFlipEl.checked = !!anpr.flip_horizontal;
        streamPrefill = true;
      }

      const showSnapshot = anpr.camera === "connected" || anpr.camera === "connecting";
      if (anpr.camera !== lastCameraState) {
        lastCameraState = anpr.camera;
        if (anpr.camera !== "connected") {
          snapshotEl.removeAttribute("src");
        }
      }
      if (showSnapshot && anpr.camera === "connected" && anpr.has_frame) {
        refreshSnapshot();
      } else if (anpr.camera === "connecting") {
        snapshotWrapEl.classList.add("visible");
      } else {
        snapshotWrapEl.classList.remove("visible");
      }

      const events = anpr.events || [];
      const fresh = events
        .filter((ev) => ev.id > lastAnprEventId)
        .sort((a, b) => a.id - b.id);
      fresh.forEach((ev) => {
        appendLog(ev.text, ev.kind === "warn" ? "" : ev.kind);
        lastAnprEventId = Math.max(lastAnprEventId, ev.id);
      });
    }

    function renderStatus(data) {
      const label = data.label || "неизвестно";
      statusEl.textContent = label;
      statusEl.className = "status-value";
      if (data.state === 0) statusEl.classList.add("open");
      else if (data.state === 1) statusEl.classList.add("closed");
      else statusEl.classList.add("unknown");
      if (data.anpr) renderAnpr(data.anpr);
    }

    async function apiCall(method, path) {
      setButtonsDisabled(true);
      try {
        const res = await fetch(path, { method });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = formatApiError(data, res);
          appendLog(msg, "error");
          showToast(msg);
          return null;
        }
        if (data.label !== undefined) renderStatus(data);
        if (data.message) {
          appendLog(data.message, "success");
          showToast(data.message);
        }
        return data;
      } catch (err) {
        appendLog(String(err), "error");
        showToast("Сервер не отвечает — запустите python web_server.py");
        return null;
      } finally {
        setButtonsDisabled(false);
      }
    }

    function refreshSnapshot() {
      snapshotTick += 1;
      snapshotEl.onload = () => snapshotWrapEl.classList.add("visible");
      snapshotEl.onerror = () => snapshotWrapEl.classList.remove("visible");
      snapshotEl.src = "/api/anpr/snapshot?t=" + snapshotTick;
    }

    function formatApiError(data, res) {
      const detail = data?.detail;
      if (Array.isArray(detail)) {
        return detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
      }
      if (typeof detail === "string" && detail.trim()) return detail;
      if (res.status === 404) {
        return "Сервер устарел — перезапустите: python web_server.py";
      }
      return res.statusText || "Ошибка запроса";
    }

    async function connectStream() {
      const url = rtspUrlEl.value.trim();
      if (!url) {
        showToast("Вставьте RTSP URL");
        return;
      }
      btnStreamEl.disabled = true;
      snapshotEl.removeAttribute("src");
      snapshotWrapEl.classList.add("visible");
      try {
        const res = await fetch("/api/anpr/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, flip: rtspFlipEl.checked }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = formatApiError(data, res);
          appendLog(msg, "error");
          showToast(msg);
          return;
        }
        if (data.anpr) renderAnpr(data.anpr);
        const msg = data.message || "Подключаюсь к камере";
        appendLog(msg, "success");
        showToast(msg);
      } catch (err) {
        appendLog(String(err), "error");
        showToast("Сервер не отвечает — запустите python web_server.py");
      } finally {
        btnStreamEl.disabled = false;
      }
    }

    document.getElementById("btn-open").addEventListener("click", () => apiCall("POST", "/api/open"));
    document.getElementById("btn-close").addEventListener("click", () => apiCall("POST", "/api/close"));
    document.getElementById("btn-refresh").addEventListener("click", () => apiCall("POST", "/api/refresh"));
    btnStreamEl.addEventListener("click", connectStream);
    rtspUrlEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") connectStream();
    });

    appendLog("Веб-панель запущена");
    apiCall("GET", "/api/status").then((data) => {
      if (!data) return;
      if (!data.api_version || data.api_version < 2) {
        appendLog("Сервер устарел — перезапустите: python web_server.py", "error");
        showToast("Перезапустите web_server.py");
      } else {
        appendLog(`Начальное состояние: ${data.label}`);
      }
    });
    setInterval(() => {
      fetch("/api/status")
        .then((res) => (res.ok ? res.json() : Promise.reject(new Error("bad status"))))
        .then((data) => {
          if (!serverOnline) {
            serverOnline = true;
            appendLog("Связь с сервером восстановлена", "success");
          }
          renderStatus(data);
        })
        .catch(() => {
          if (serverOnline) {
            serverOnline = false;
            appendLog("Сервер не отвечает — запустите python web_server.py", "error");
            showToast("Сервер не отвечает");
          }
        });
    }, 3000);
    setInterval(() => {
      if (!serverOnline || lastCameraState !== "connected") return;
      refreshSnapshot();
    }, 3000);
  </script>
</body>
</html>
